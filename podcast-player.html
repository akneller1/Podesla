<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dash Pods</title>
<style>
:root{
  --bg:#0e1116; --panel:#171c24; --panel2:#1f2630; --line:#2b3441;
  --fg:#eef2f7; --mute:#93a0b2; --accent:#ffb020; --accent-fg:#1a1200; --bad:#ff6b6b;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:20px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:16px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--panel2);border-radius:var(--r);min-height:68px;padding:0 22px}
button:active{filter:brightness(1.25)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;gap:12px}
.panel{background:var(--panel);border-radius:var(--r);padding:16px;min-height:0}
h2{margin:0 0 8px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* player */
#player{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.now{display:flex;gap:16px;align-items:center;min-width:0}
#art{width:130px;height:130px;border-radius:14px;background:var(--panel2);object-fit:cover;flex:none}
.now .t{min-width:0}
#title{font-size:24px;font-weight:650;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#show{color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{display:flex;align-items:center;gap:14px}
.seek span{font-variant-numeric:tabular-nums;color:var(--mute);min-width:76px;text-align:center;font-size:19px}
input[type=range]{flex:1;height:48px;accent-color:var(--accent);background:transparent}
.ctl{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr 1fr;gap:12px}
.ctl button{font-size:22px;font-weight:600;min-height:92px}
#play{background:var(--accent);color:var(--accent-fg);font-size:34px}
.ctl small{display:block;font-size:14px;color:var(--mute);font-weight:500;margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row2 button{min-height:68px}
#msg{min-height:1.4em;color:var(--bad);font-size:17px}

/* browse */
.search{display:flex;gap:12px}
#q{flex:1;min-width:0;height:68px;border-radius:var(--r);border:2px solid var(--line);background:var(--bg);padding:0 18px}
#go{background:var(--accent);color:var(--accent-fg);font-weight:700}
.tabs{display:flex;gap:10px}
.tabs button{flex:1;min-height:60px}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg);font-weight:700}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;overscroll-behavior:contain}
.item{display:flex;gap:14px;align-items:center;background:var(--panel2);border-radius:var(--r);padding:12px;text-align:left;width:100%;min-height:92px}
.item img{width:68px;height:68px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg)}
.item .m{min-width:0;flex:1}
.item .n{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .s{color:var(--mute);font-size:16px;margin-top:2px}
.item.cur{outline:3px solid var(--accent)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--mute);padding:24px;text-align:center}
.back{min-height:60px}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);overflow:auto;height:auto}
  #art{width:90px;height:90px}
}
@media (prefers-reduced-motion:no-preference){button{transition:filter .1s}}
</style>
</head>
<body>

<div class="col">
  <section class="panel" id="player" aria-label="Player">
    <h2>Now playing</h2>
    <div class="now">
      <img id="art" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
      <div class="t"><div id="title">Pick an episode</div><div id="show"></div></div>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
    <div class="ctl">
      <button id="b15">&minus;15<small>sec</small></button>
      <button id="b30">&minus;30<small>sec</small></button>
      <button id="play" aria-label="Play or pause">&#9654;</button>
      <button id="f30">+30<small>sec</small></button>
      <button id="f90">+90<small>skip ad</small></button>
    </div>
    <div class="row2">
      <button id="speed">Speed 1&times;</button>
      <button id="sleep">Sleep: off</button>
      <button id="next">Next episode</button>
    </div>
    <div id="msg" role="status"></div>
  </section>
  <section class="panel" style="font-size:16px;color:var(--mute)">
    Ads recorded into an episode can't be removed. Use +90 to jump past them. Progress is saved for every episode.
  </section>
</div>

<div class="col panel" style="min-height:0">
  <div class="search">
    <input id="q" type="search" placeholder="Search podcasts or paste a feed link" enterkeyhint="search" autocomplete="off">
    <button id="go">Search</button>
  </div>
  <div class="tabs">
    <button id="tabSubs" aria-pressed="true">My shows</button>
    <button id="tabEps" aria-pressed="false">Episodes</button>
    <button id="tabRes" aria-pressed="false">Results</button>
  </div>
  <div id="list"></div>
</div>

<audio id="a" preload="metadata"></audio>

<script>
(function(){
  "use strict";
  var $ = function(id){return document.getElementById(id)};
  var audio = $("a"), listEl = $("list"), msg = $("msg");
  var PROXIES = [
    function(u){return u},
    function(u){return "https://corsproxy.io/?url="+encodeURIComponent(u)},
    function(u){return "https://api.allorigins.win/raw?url="+encodeURIComponent(u)}
  ];

  // ---------- storage ----------
  function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var subs = load("dp.subs", []);          // [{id,name,artist,art,feed}]
  var prog = load("dp.prog", {});          // {episodeUrl:{t,d}}
  var last = load("dp.last", null);        // {ep, show}
  var state = { tab:"subs", results:[], eps:[], show:null, cur:null, sleepAt:0 };

  function say(t){ msg.textContent = t || ""; }
  function fmt(s){
    if(!isFinite(s)) return "0:00"; s = Math.max(0, Math.floor(s));
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
    return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0");
  }
  function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function https(u){ return (u||"").replace(/^http:\/\//i, "https://"); }

  // ---------- network ----------
  function fetchText(url, i){
    i = i || 0;
    if(i >= PROXIES.length) return Promise.reject(new Error("Could not reach this feed."));
    return fetch(PROXIES[i](url)).then(function(r){
      if(!r.ok) throw new Error("bad status");
      return r.text();
    }).catch(function(){ return fetchText(url, i+1); });
  }
  // JSONP works even where fetch() to another site is blocked
  function jsonp(url, ms){
    return new Promise(function(res, rej){
      var cb = "dp_cb_" + Math.random().toString(36).slice(2), s = document.createElement("script"), done = false;
      function clean(){ done = true; try{ delete window[cb]; }catch(e){ window[cb] = undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function(d){ clean(); res(d); };
      s.onerror = function(){ if(!done){ clean(); rej(new Error("script blocked")); } };
      s.src = url + "&callback=" + cb;
      document.head.appendChild(s);
      setTimeout(function(){ if(!done){ clean(); rej(new Error("timeout")); } }, ms || 10000);
    });
  }
  function itunes(term){
    var url = "https://itunes.apple.com/search?media=podcast&limit=25&term=" + encodeURIComponent(term);
    return fetch(url).then(function(r){ if(!r.ok) throw new Error("status "+r.status); return r.json(); })
      .catch(function(){ return jsonp(url); })
      .catch(function(){ return fetchText(url).then(JSON.parse); });
  }
  function search(term){
    say("");
    state.tab = "res"; render();
    if(/^https?:\/\//i.test(term)){
      openShow({ id:term, name:term, artist:"", art:"", feed:https(term) });
      return;
    }
    listEl.innerHTML = '<div class="empty">Searching for “'+esc(term)+'”…</div>';
    itunes(term).then(function(j){
      state.results = (j.results||[]).filter(function(x){return x.feedUrl}).map(function(x){
        return { id:x.collectionId, name:x.collectionName, artist:x.artistName, art:https(x.artworkUrl600||x.artworkUrl100||""), feed:https(x.feedUrl) };
      });
      if(!state.results.length){ listEl.innerHTML = '<div class="empty">No podcasts found for “'+esc(term)+'”. Try a different name.</div>'; return; }
      render();
    }).catch(function(e){
      listEl.innerHTML = '<div class="empty">Search could not reach the podcast directory ('+esc(e && e.message || "network error")+
        '). You can also paste a podcast feed address (starting with https://) into the box and tap Search.</div>';
    });
  }
  function openShow(show){
    state.show = show; state.tab = "eps"; state.eps = [];
    render();
    listEl.innerHTML = '<div class="empty">Loading episodes…</div>';
    fetchText(show.feed).then(function(xml){
      var doc = new DOMParser().parseFromString(xml, "text/xml");
      var ch = doc.querySelector("channel > title"), chImg = doc.getElementsByTagName("itunes:image")[0];
      if(ch && (!show.name || /^https?:/.test(show.name))) show.name = ch.textContent;
      if(!show.art && chImg) show.art = https(chImg.getAttribute("href") || "");
      var items = Array.prototype.slice.call(doc.querySelectorAll("item"));
      state.eps = items.map(function(it){
        var enc = it.querySelector("enclosure");
        if(!enc) return null;
        var dur = it.getElementsByTagName("itunes:duration")[0];
        var img = it.getElementsByTagName("itunes:image")[0];
        var pd = it.querySelector("pubDate");
        return {
          title: (it.querySelector("title")||{}).textContent || "Episode",
          url: https(enc.getAttribute("url")),
          date: pd ? new Date(pd.textContent) : null,
          dur: dur ? dur.textContent : "",
          art: img ? https(img.getAttribute("href")) : show.art
        };
      }).filter(Boolean).slice(0, 100);
      render();
    }).catch(function(e){ listEl.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
  }

  // ---------- rendering ----------
  function setTabs(){
    $("tabSubs").setAttribute("aria-pressed", state.tab==="subs");
    $("tabEps").setAttribute("aria-pressed", state.tab==="eps");
    $("tabRes").setAttribute("aria-pressed", state.tab==="res");
  }
  function showItem(s, subscribed){
    return '<button class="item" data-show="'+esc(s.feed)+'"><img alt="" src="'+esc(s.art)+'"><span class="m"><div class="n">'+esc(s.name)+
      '</div><div class="s">'+esc(s.artist||"")+(subscribed?"":"")+'</div></span></button>';
  }
  function render(){
    setTabs();
    var html = "";
    if(state.tab === "subs"){
      html = subs.length ? subs.map(function(s){ return showItem(s, true); }).join("")
        : '<div class="empty">No shows yet. Search for a podcast, open it, and tap Add to my shows.</div>';
    } else if(state.tab === "res"){
      html = state.results.length ? state.results.map(function(s){ return showItem(s, false); }).join("")
        : '<div class="empty">Search for a podcast above.</div>';
    } else {
      if(!state.show){ html = '<div class="empty">Open a show to see its episodes.</div>'; }
      else {
        var isSub = subs.some(function(s){ return s.feed === state.show.feed; });
        html = '<div style="display:flex;gap:10px"><button class="back" style="flex:1" id="addBtn">'+(isSub?"Remove from my shows":"Add to my shows")+'</button></div>';
        html += state.eps.map(function(e, i){
          var p = prog[e.url], pct = p && p.d ? Math.min(100, Math.round(p.t/p.d*100)) : 0;
          var d = e.date && !isNaN(e.date) ? e.date.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";
          return '<button class="item'+(state.cur===e.url?" cur":"")+'" data-ep="'+i+'"><img alt="" src="'+esc(e.art)+'"><span class="m"><div class="n">'+esc(e.title)+
            '</div><div class="s">'+esc(d)+(e.dur && /[:\d]/.test(e.dur) ? " · "+esc(fmtDur(e.dur)) : "")+'</div>'+
            (pct ? '<div class="bar"><i style="width:'+pct+'%"></i></div>' : "")+'</span></button>';
        }).join("");
      }
    }
    listEl.innerHTML = html;
  }
  function fmtDur(d){
    if(/^\d+$/.test(d)) return fmt(+d);
    return d.replace(/^00:/,"").replace(/^0/,"");
  }

  listEl.addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if(!b) return;
    if(b.id === "addBtn"){
      var i = subs.findIndex(function(s){ return s.feed === state.show.feed; });
      if(i >= 0) subs.splice(i,1); else subs.unshift(state.show);
      save("dp.subs", subs); render(); return;
    }
    if(b.dataset.show){
      var all = subs.concat(state.results);
      var s = all.find(function(x){ return x.feed === b.dataset.show; });
      if(s) openShow(s); return;
    }
    if(b.dataset.ep != null){ playEp(state.eps[+b.dataset.ep], state.show, true); }
  });
  $("tabSubs").onclick = function(){ state.tab="subs"; render(); };
  $("tabEps").onclick = function(){ state.tab="eps"; render(); };
  $("tabRes").onclick = function(){ state.tab="res"; render(); };
  $("go").onclick = function(){ var t = $("q").value.trim(); if(t) search(t); };
  $("q").addEventListener("keydown", function(e){ if(e.key === "Enter"){ $("go").click(); } });

  // ---------- playback ----------
  function playEp(ep, show, autoplay){
    if(!ep) return;
    state.cur = ep.url; state.curEp = ep; state.curShow = show;
    audio.src = ep.url;
    var p = prog[ep.url];
    var start = p && p.t > 5 && p.d && p.t < p.d - 20 ? p.t : 0;
    audio.addEventListener("loadedmetadata", function once(){
      audio.removeEventListener("loadedmetadata", once);
      if(start) audio.currentTime = start;
    });
    $("title").textContent = ep.title;
    $("show").textContent = show ? show.name : "";
    $("art").src = ep.art || (show && show.art) || $("art").src;
    save("dp.last", { ep: ep, show: show });
    setSession(ep, show);
    if(autoplay){ audio.play().catch(function(){ say("Tap play to start."); }); }
    if(state.tab === "eps") render();
  }
  function toggle(){
    if(!audio.src){ say("Pick an episode first."); return; }
    if(audio.paused) audio.play().catch(function(){ say("Could not play this episode."); });
    else audio.pause();
  }
  function jump(s){ if(audio.src){ audio.currentTime = Math.max(0, Math.min((audio.duration||1e9)-1, audio.currentTime + s)); } }

  $("play").onclick = toggle;
  $("b15").onclick = function(){ jump(-15); };
  $("b30").onclick = function(){ jump(-30); };
  $("f30").onclick = function(){ jump(30); };
  $("f90").onclick = function(){ jump(90); };
  $("next").onclick = nextEp;
  function nextEp(){
    if(!state.show || !state.eps.length) return;
    var i = state.eps.findIndex(function(e){ return e.url === state.cur; });
    // feeds list newest first, so the following unheard episode is the previous index
    var n = i > 0 ? state.eps[i-1] : null;
    if(n) playEp(n, state.show, true); else say("No newer episode in this list.");
  }
  var speeds = [1, 1.25, 1.5, 1.75, 2, 0.85], si = 0;
  $("speed").onclick = function(){
    si = (si+1) % speeds.length; audio.playbackRate = speeds[si];
    $("speed").innerHTML = "Speed "+speeds[si]+"&times;";
  };
  var sleepOpts = [0, 15, 30, 60], soi = 0;
  $("sleep").onclick = function(){
    soi = (soi+1) % sleepOpts.length;
    state.sleepAt = sleepOpts[soi] ? Date.now() + sleepOpts[soi]*60000 : 0;
    $("sleep").textContent = "Sleep: " + (sleepOpts[soi] ? sleepOpts[soi]+" min" : "off");
  };

  var seeking = false, lastSave = 0;
  $("seek").addEventListener("input", function(){ seeking = true; $("cur").textContent = fmt(audio.duration * $("seek").value/1000); });
  $("seek").addEventListener("change", function(){ if(audio.duration) audio.currentTime = audio.duration * $("seek").value/1000; seeking = false; });
  audio.addEventListener("timeupdate", function(){
    if(!seeking && audio.duration){
      $("seek").value = Math.round(audio.currentTime/audio.duration*1000);
      $("cur").textContent = fmt(audio.currentTime);
    }
    $("dur").textContent = fmt(audio.duration);
    var now = Date.now();
    if(state.cur && now - lastSave > 5000 && audio.duration){
      lastSave = now; prog[state.cur] = { t: audio.currentTime, d: audio.duration }; save("dp.prog", prog);
    }
    if(state.sleepAt && now > state.sleepAt){
      audio.pause(); state.sleepAt = 0; soi = 0; $("sleep").textContent = "Sleep: off";
    }
    updatePosition();
  });
  audio.addEventListener("play", function(){ $("play").innerHTML = "&#10074;&#10074;"; if("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing"; });
  audio.addEventListener("pause", function(){ $("play").innerHTML = "&#9654;"; if("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    if(state.cur && audio.duration){ prog[state.cur] = { t: audio.currentTime, d: audio.duration }; save("dp.prog", prog); } });
  audio.addEventListener("ended", function(){ if(state.cur && audio.duration){ prog[state.cur] = { t: audio.duration, d: audio.duration }; save("dp.prog", prog); } nextEp(); });
  audio.addEventListener("error", function(){ say("This episode won't play. Try another one."); });
  audio.addEventListener("waiting", function(){ say("Buffering…"); });
  audio.addEventListener("playing", function(){ say(""); });

  // ---------- media session (keeps it in the Tesla mini-player) ----------
  function setSession(ep, show){
    if(!("mediaSession" in navigator)) return;
    var art = ep.art || (show && show.art);
    navigator.mediaSession.metadata = new MediaMetadata({
      title: ep.title, artist: show ? show.artist || show.name : "", album: show ? show.name : "",
      artwork: art ? [{ src: art, sizes: "512x512" }] : []
    });
  }
  function updatePosition(){
    if(!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState || !isFinite(audio.duration)) return;
    try{ navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration) }); }catch(e){}
  }
  if("mediaSession" in navigator){
    var ms = navigator.mediaSession;
    function h(n, f){ try{ ms.setActionHandler(n, f); }catch(e){} }
    h("play", function(){ audio.play(); });
    h("pause", function(){ audio.pause(); });
    h("seekbackward", function(d){ jump(-((d && d.seekOffset) || 15)); });
    h("seekforward", function(d){ jump((d && d.seekOffset) || 30); });
    h("previoustrack", function(){ jump(-30); });
    h("nexttrack", function(){ jump(90); });
    h("seekto", function(d){ if(d && d.seekTime != null) audio.currentTime = d.seekTime; });
  }

  // ---------- resume last episode ----------
  if(last && last.ep){ playEp(last.ep, last.show, false); }
  if(subs.length){ state.tab = "subs"; }
  else { $("q").value = ""; }
  render();
})();
</script>
</body>
</html>
